name: wheels

# Wheels are built for every push so that a break is visible immediately, and
# published only when a v* tag is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-latest,  target: x86_64,  manylinux: "2014", testable: true  }
          # aarch64 is cross-built under QEMU; running the wheel here would need
          # emulation of the whole interpreter, so it is checked, not executed.
          - { name: linux-aarch64, os: ubuntu-latest,  target: aarch64, manylinux: "2014", testable: false }
          - { name: windows-x64,   os: windows-latest, target: x64,     manylinux: "auto", testable: true  }
          - { name: macos-x86_64,  os: macos-13,       target: x86_64,  manylinux: "auto", testable: true  }
          - { name: macos-arm64,   os: macos-14,       target: aarch64, manylinux: "auto", testable: true  }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - name: Install the built wheel and run the test suite
        if: matrix.testable
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # Install by wheel path, so a source rebuild cannot silently stand in
          # for the artifact under test.
          python -m pip install --no-index --find-links dist partition-lattice
          python -c "import partition_lattice, platform; print(platform.system(), platform.machine(), partition_lattice.__version__)"
          python -m pytest -q tests/

      - name: Check the wheel metadata
        shell: bash
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  # The wheels are tagged cp38-abi3, which promises CPython 3.8 and newer. Every job
  # above runs on 3.12, so until now that promise was asserted and never exercised —
  # and it is exactly the kind of claim that fails quietly: a build picks up a symbol
  # from a newer C API, the wheel still installs, and it only breaks for the users on
  # the oldest interpreter the tag invited in.
  #
  # This job installs the built Linux wheel on the *floor* version and runs the suite.
  # Found the hard way: a wheel built while pinning a newer interpreter linked
  # PyType_GetName (3.11+) and imported fine on 3.11 and 3.12 while being broken on 3.9.
  abi3-floor:
    name: abi3 floor (3.9)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Install the wheel on the oldest supported interpreter and test it
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --only-binary :all: dist/*.whl
          python -c "import sys, partition_lattice as p; print(sys.version); print(p.__version__)"
          python -m pytest -q tests/

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Build from the sdist and run the test suite
        run: |
          python -m pip install --upgrade pip pytest
          # Building from the sdist is what every unsupported platform does, so it
          # has to be exercised rather than assumed.
          python -m pip install dist/*.tar.gz
          python -m pytest -q tests/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    # abi3-floor gates this: a wheel that is broken on the oldest interpreter its own
    # tag invites is not a wheel worth shipping, and that break is invisible on 3.12.
    needs: [build, sdist, abi3-floor]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
      # long-lived API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List what is about to be published
        run: ls -l dist

      - name: Refuse to publish if the tag and the version disagree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Every file carries the version in its name; a mismatch means the tag
          # was moved or the bump was forgotten.
          for f in dist/*; do
            case "$(basename "$f")" in
              partition_lattice-"$TAG"[-.]*) ;;
              *) echo "::error::$(basename "$f") does not match tag version $TAG"; exit 1 ;;
            esac
          done
          echo "all artifacts match version $TAG"

      - uses: pypa/gh-action-pypi-publish@release/v1
