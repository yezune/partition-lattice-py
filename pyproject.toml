[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "partition-lattice"
description = "Partition lattice algebra in exact integer arithmetic: meet, join, and logical entropy"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Picolab LLC" }]
requires-python = ">=3.8"
keywords = ["partition", "lattice", "combinatorics", "information-theory", "logical-entropy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/yezune/partition-lattice-py"
Repository = "https://github.com/yezune/partition-lattice-py"
Documentation = "https://github.com/yezune/partition-lattice-py#readme"
Source = "https://crates.io/crates/partition-lattice"

[tool.maturin]
features = ["extension-module"]
module-name = "partition_lattice._partition_lattice"
python-source = "python"
strip = true
